# deleg8 configuration: one file onboards an AI employee onto a team's tools.
employee:
  name: Dex
  title: Junior Software Engineer (AI)

# Where work comes from: github (GitHub Issues) | plane (open source, self-hosted or cloud) | jira (Jira Cloud).
# Switch without editing: `deleg8 --pm plane <command>` or DELEG8_PM=plane.
pm:
  provider: github
  github:
    repo: attrivivekai/deleg8-website
  plane:
    base_url: ${PLANE_BASE_URL}       # http://localhost (self-hosted) or https://api.plane.so (cloud)
    api_key: ${PLANE_API_KEY}         # Plane: Profile settings -> Personal access tokens
    workspace: ${PLANE_WORKSPACE}     # workspace slug from the URL
    project: DEL                      # project identifier
  jira:
    base_url: ${JIRA_BASE_URL}        # https://<site>.atlassian.net
    email: ${JIRA_EMAIL}
    api_token: ${JIRA_API_TOKEN}
    project: DEL

# Repos the employee may change. `checks` must pass locally before a PR is opened.
repos:
  - name: deleg8-website
    github: attrivivekai/deleg8-website
    default_branch: main
    deploy_url: https://attrivivekai.github.io/deleg8-website/
    setup: ["uv sync -q"]
    checks:
      - "uv run ruff check ."
      - "uv run ruff format --check ."
      - "uv run pytest -q"

# Research access (all read-only).
knowledge:
  wiki_dirs: [demo/wiki]
  databases:
    app:
      url: postgresql://dex_readonly:dex_readonly@localhost:5434/deleg8
      description: Production Postgres for the website (waitlist_signups). Read-only role.
    warehouse:
      url: duckdb:///demo/warehouse/warehouse.duckdb
      description: Analytics warehouse (demo_requests, web_sessions, mrr_monthly).

# ---- Harnesses: which agent does the thinking and coding --------------------------------------------
# DEFAULT: DeepSeek Harness (dsh) on a LOCAL model, reusing the local-ai panel (~/local-ai). Whatever model
# you start in the panel (llama-server :8080) is what Dex uses: the panel keeps this DSH home in sync.
# Dex only works while that model is loaded; otherwise it waits. Switch per run with --harness claude
# (or DELEG8_HARNESS=claude).
x-dsh: &dsh
  provider: dsh
  command: ["/usr/lib/augmentor/node/bin/node",
            "~/.local/share/augmentor/dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js"]
  env:
    DSH_HOME: ~/.local/share/augmentor/dsh-home
    DSH_TELEMETRY_MODE: DISABLED
  env_file: ~/.local/state/augmentor-install/model.env   # AUGMENTOR_MODEL_API_KEY for the local provider

# The harness that writes code (full edit access inside the task's workspace).
coding_agent:
  <<: *dsh
  permission_mode: workspace-write   # use danger-full-access if the sandbox blocks test runs
  timeout_s: 3600                    # local models are slower; one task may take a while

# The harness used for planning, code review and reports (always read-only).
brain:
  <<: *dsh
  timeout_s: 1800

# Named presets, selected with --harness <name> or DELEG8_HARNESS=<name>.
harnesses:
  dsh:
    coding_agent: {<<: *dsh, permission_mode: workspace-write, timeout_s: 3600}
    brain: {<<: *dsh, timeout_s: 1800}
  claude:   # Claude Code headless (needs the `claude` CLI logged in; paid per token)
    coding_agent: {provider: claude_code, model: claude-sonnet-5-5, max_budget_usd: 5, timeout_s: 1800}
    brain: {provider: claude_code, model: claude-opus-5-5, max_budget_usd: 3, timeout_s: 900}
  pi:       # pi with whatever provider/model pi is configured for
    coding_agent: {provider: pi, timeout_s: 1800}
    brain: {provider: pi, timeout_s: 900}

policy:
  auto_merge: false       # every PR waits for a human (repo owner) review + merge
  ai_review: true
  wait_for_ci: true
  ci_timeout_s: 1200
  max_fix_attempts: 2
  max_review_rounds: 2
  max_tasks_per_run: 10
  max_tasks_per_epic: 6

workspace: .deleg8/workspaces
