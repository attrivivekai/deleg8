[project]
name = "deleg8"
version = "0.1.0"
description = "deleg8: a harness that turns a coding agent into an autonomous junior employee driven by project-management tickets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6",
    "httpx>=0.27",
    "mcp>=2.3",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
deleg8 = "deleg8.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deleg8"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["demo/website"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
